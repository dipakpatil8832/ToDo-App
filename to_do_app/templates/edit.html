<!DOCTYPE html>
<html lang="en">
<head>
<title>Edit Task</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-dark text-white">
<div class="container mt-5">
<h3>Edit Task</h3>

<form method="POST">
    <label>Description:</label>
    <input type="text" name="description" value="{{ task.description }}" class="form-control" required>

    <label class="mt-3">Due Date:</label>
    <input type="date" name="due_date" value="{{ task.due_date }}" class="form-control">

    <button class="btn btn-primary mt-4">Update ✏️</button>
    <a href="/" class="btn btn-secondary mt-4">Cancel</a>
</form>

</div>
</body>
</html>
